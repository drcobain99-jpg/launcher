<title>북마크 런처</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}
html{color-scheme:light}
/* Layout: 제목 한 줄 + 아이콘 그리드 (iPad 홈 화면과 같은 정사각 타일). 편집은 오버레이 패널에서. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#18202C; --muted:#66707F; --line:#D5DBE4;
  --accent:#2459D6; --accent-ink:#FFFFFF; --danger:#C7372F; --shadow:rgba(24,32,44,.14);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151B; --surface:#1A2029; --ink:#EAEEF4; --muted:#98A2B1; --line:#2E3745;
    --accent:#7FA3FF; --accent-ink:#0B1220; --danger:#FF7A70; --shadow:rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --ink:#EAEEF4; --muted:#98A2B1; --line:#2E3745;
  --accent:#7FA3FF; --accent-ink:#0B1220; --danger:#FF7A70; --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));min-height:100vh}
.wrap{max-width:1240px;margin:0 auto}
header{position:relative;margin-bottom:10px}
#editBtn{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.title{display:block;width:100%;min-width:0;text-align:center;padding-inline:112px;font:700 clamp(28px,5vw,44px)/1.2 var(--font);color:var(--ink);background:transparent;border:0;
  border-bottom:2px dashed transparent;border-radius:0;padding-block:4px;letter-spacing:-.01em}
.title::placeholder{color:var(--muted)}
.title:hover{border-bottom-color:var(--line)}
.title:focus{outline:none;border-bottom:2px solid var(--accent)}
.btn{font:500 16px var(--font);min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:focus-visible,.tile:focus-visible,.sw:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--danger)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.hint{color:var(--muted);font-size:14px;min-height:21px;margin:0 0 32px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,196px);justify-content:center;gap:40px 20px}
.tile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;position:relative;
  -webkit-tap-highlight-color:transparent;text-align:center;padding:4px 0}
.icon{width:156px;height:156px;border-radius:37px;display:flex;align-items:center;justify-content:center;
  font:700 81px/1 var(--font);background-size:cover;background-position:center;box-shadow:0 6px 16px var(--shadow);transition:transform .12s}
.tile:active .icon{transform:scale(.94)}
.name{font-weight:500;font-size:18px;max-width:192px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:14px;color:var(--muted);margin-top:-6px}
.badge{position:absolute;top:0;right:calc(50% - 96px);width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 6px var(--shadow)}
.add .icon{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted);font-weight:400;font-size:66px}
.add .name{color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center;color:var(--muted);margin-bottom:28px}
.status{margin-top:44px;font-size:13px;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn.small{min-height:40px;font-size:14px;padding:0 14px;color:var(--muted)}
/* editor */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.panel{background:var(--surface);color:var(--ink);width:100%;max-width:540px;max-height:calc(100vh - 32px);overflow:auto;border-radius:22px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.panel h2{margin:0 0 18px;font-size:20px}
.prev{display:flex;justify-content:center;margin-bottom:18px}
.prev .icon{width:120px;height:120px;border-radius:29px;font-size:62px}
label.l{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input.f{width:100%;min-height:46px;font:400 16px var(--font);padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input.f:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{all:unset;box-sizing:border-box;width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
input[type=color]{width:46px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;align-items:center}
.actions .grow{flex:1}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.icon{transition:none}}
@media (max-width:640px){.title{padding-inline:0}#editBtn{position:static;transform:none;display:block;margin:8px auto 0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <input id="title" class="title" type="text" maxlength="40" placeholder="이름을 입력하세요" aria-label="전체 이름" autocomplete="off">
    <button id="editBtn" class="btn" type="button" aria-pressed="false">편집</button>
  </header>
  <p class="hint" id="hint">아이콘을 누르면 해당 사이트가 열립니다. 위의 이름을 눌러 바꿀 수 있어요.</p>
  <div class="empty" id="empty" hidden>아직 북마크가 없습니다. 아래 “추가”를 눌러 첫 북마크를 만들어 보세요.</div>
  <div class="grid" id="grid"></div>
  <div class="status" id="status" role="status"></div>
  <div class="tools"><button class="btn small" id="expBtn" type="button">백업 저장</button><button class="btn small" id="impBtn" type="button">백업 불러오기</button><input type="file" id="impFile" accept="application/json,.json" hidden></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <h2 id="pTitle">북마크 편집</h2>
    <div class="prev"><span class="icon" id="prevIcon"></span></div>
    <label class="l" for="fName">이름</label>
    <input class="f" id="fName" type="text" maxlength="30" autocomplete="off">
    <label class="l" for="fUrl">주소</label>
    <input class="f" id="fUrl" type="url" inputmode="url" placeholder="https://" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="l" for="fGlyph">아이콘 글자 (1~2자)</label>
    <input class="f" id="fGlyph" type="text" maxlength="2" autocomplete="off">
    <label class="l">아이콘 색</label>
    <div class="row" id="swatches"></div>
    <label class="l">또는 내 사진으로</label>
    <div class="row">
      <button class="btn" id="pickImg" type="button">사진 선택</button>
      <button class="btn" id="clearImg" type="button">사진 빼기</button>
      <input type="file" id="fileImg" accept="image/*" hidden>
    </div>
    <div class="err" id="err" role="alert"></div>
    <div class="actions">
      <button class="btn primary" id="saveBtn" type="button">저장</button>
      <button class="btn" id="cancelBtn" type="button">취소</button>
      <span class="grow"></span>
      <button class="btn" id="leftBtn" type="button" aria-label="앞으로 이동">← 앞으로</button>
      <button class="btn" id="rightBtn" type="button" aria-label="뒤로 이동">뒤로 →</button>
      <button class="btn danger" id="delBtn" type="button">삭제</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var COLORS=["#1C1C1E","#8E8E93","#2459D6","#0F9D8A","#E5484D","#F59E0B","#8B5CF6","#EC6AA0"];
  var LS="bookmark-launcher-v1";
  var st={title:"",tiles:[]};
  var db=null, mode="local", editMode=false, draft=null, delArmed=false, busy=false;

  var saveFail=false;
  var DEFAULTS=[
    {id:"t1",name:"뱀사다리 메이커",url:"",glyph:"뱀",bg:"#1C1C1E",img:"",order:1},
    {id:"t2",name:"빙고",url:"",glyph:"우",bg:"#8E8E93",img:"",order:2},
    {id:"t3",name:"포켓몬",url:"",glyph:"포",bg:"#1C1C1E",img:"",order:3},
    {id:"t4",name:"룰렛 놀이",url:"",glyph:"룰",bg:"#1C1C1E",img:"",order:4}
  ];
  function lsLoad(){
    var raw=null;
    try{raw=localStorage.getItem(LS)}catch(e){saveFail=true}
    if(raw){try{var j=JSON.parse(raw);if(j&&Array.isArray(j.tiles)){st={title:String(j.title||""),tiles:j.tiles};return}}catch(e){}}
    st={title:"내 북마크",tiles:JSON.parse(JSON.stringify(DEFAULTS))};
  }
  function lsSave(){
    try{localStorage.setItem(LS,JSON.stringify(st));saveFail=false;setStatus("이 기기에 저장됨")}
    catch(e){saveFail=true;setStatus("저장하지 못했습니다. 사진이 너무 크거나 브라우저 저장이 꺼져 있을 수 있어요.")}
  }
  function setStatus(t){$("#status").textContent=t}
  function safeUrl(u){
    u=String(u||"").trim(); if(!u) return "";
    if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u="https://"+u;
    return /^https?:\/\//i.test(u)?u:"";
  }
  function okColor(c){return /^#[0-9a-fA-F]{6}$/.test(c||"")?c:COLORS[0]}
  function okImg(s){return /^data:image\/(jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(s||"")}
  function fgFor(hex){
    var n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
    return (0.299*r+0.587*g+0.114*b)>170?"#111111":"#FFFFFF";
  }
  function sorted(){return st.tiles.slice().sort(function(a,b){return (a.order||0)-(b.order||0)})}

  function applyIcon(el,t){
    var bg=okColor(t.bg);
    el.textContent=""; el.style.backgroundImage="";
    if(okImg(t.img)){ el.style.backgroundImage='url("'+t.img+'")'; el.style.backgroundColor=bg; }
    else{
      el.style.backgroundColor=bg; el.style.color=fgFor(bg);
      el.textContent=(t.glyph||(t.name||"").trim().charAt(0)||"＋");
    }
  }

  function tileEl(t){
    var url=safeUrl(t.url), asLink=url&&!editMode;
    var el=document.createElement(asLink?"a":"button");
    el.className="tile";
    if(asLink){el.href=url;el.target="_blank";el.rel="noopener noreferrer"}
    else{el.type="button";el.addEventListener("click",function(){openEditor(t)})}
    var ic=document.createElement("span");ic.className="icon";applyIcon(ic,t);
    var nm=document.createElement("span");nm.className="name";nm.textContent=t.name||"이름 없음";
    el.appendChild(ic);el.appendChild(nm);
    if(!url&&!editMode){var s=document.createElement("span");s.className="sub";s.textContent="주소를 입력하세요";el.appendChild(s)}
    if(editMode){var b=document.createElement("span");b.className="badge";b.setAttribute("aria-hidden","true");b.textContent="✎";el.appendChild(b)}
    return el;
  }
  function addEl(){
    var el=document.createElement("button");el.type="button";el.className="tile add";
    var ic=document.createElement("span");ic.className="icon";ic.textContent="+";
    var nm=document.createElement("span");nm.className="name";nm.textContent="추가";
    el.appendChild(ic);el.appendChild(nm);
    el.addEventListener("click",function(){openEditor(null)});
    return el;
  }
  function render(){
    var g=$("#grid");g.textContent="";
    sorted().forEach(function(t){g.appendChild(tileEl(t))});
    g.appendChild(addEl());
    $("#empty").hidden=st.tiles.length>0;
    $("#hint").textContent=editMode?"아이콘을 누르면 이름·주소·모양을 바꾸거나 순서를 옮길 수 있어요.":"아이콘을 누르면 해당 사이트가 열립니다. 위의 이름을 눌러 바꿀 수 있어요.";
    var eb=$("#editBtn");eb.textContent=editMode?"완료":"편집";eb.setAttribute("aria-pressed",editMode?"true":"false");
    var ti=$("#title");if(document.activeElement!==ti)ti.value=st.title;
  }

  /* ---------- 저장 ---------- */
  function fieldsOf(t){return {name:t.name||"",url:t.url||"",glyph:t.glyph||"",bg:okColor(t.bg),img:okImg(t.img)?t.img:"",order:t.order||0}}
  async function saveTileRemote(){lsSave()}
  async function saveTitle(){
    st.title=$("#title").value.trim();
    lsSave();
  }

  /* ---------- 편집 패널 ---------- */
  function buildSwatches(){
    var box=$("#swatches");box.textContent="";
    COLORS.forEach(function(c){
      var b=document.createElement("button");b.type="button";b.className="sw";b.style.background=c;b.setAttribute("aria-label","색 "+c);b.dataset.c=c;
      b.addEventListener("click",function(){draft.bg=c;draft.img="";refreshEditor()});
      box.appendChild(b);
    });
    var ci=document.createElement("input");ci.type="color";ci.id="fColor";ci.setAttribute("aria-label","직접 색 고르기");
    ci.addEventListener("input",function(){draft.bg=ci.value.toUpperCase();draft.img="";refreshEditor()});
    box.appendChild(ci);
  }
  function refreshEditor(){
    applyIcon($("#prevIcon"),draft);
    var cur=okColor(draft.bg).toUpperCase();
    document.querySelectorAll(".sw").forEach(function(b){b.setAttribute("aria-pressed",(!okImg(draft.img)&&b.dataset.c.toUpperCase()===cur)?"true":"false")});
    $("#fColor").value=cur.toLowerCase();
    $("#clearImg").hidden=!okImg(draft.img);
    var arr=sorted(),i=arr.findIndex(function(x){return x.id===draft.id});
    $("#leftBtn").hidden=draft.isNew||i<=0;
    $("#rightBtn").hidden=draft.isNew||i<0||i>=arr.length-1;
    $("#delBtn").hidden=!!draft.isNew;
    $("#delBtn").textContent=delArmed?"정말 삭제":"삭제";
  }
  function openEditor(t){
    delArmed=false;$("#err").textContent="";
    if(t){draft={id:t.id,name:t.name||"",url:t.url||"",glyph:t.glyph||"",bg:okColor(t.bg),img:okImg(t.img)?t.img:"",order:t.order||0,isNew:false}}
    else{draft={id:"t"+Date.now().toString(36),name:"",url:"",glyph:"",bg:COLORS[0],img:"",order:0,isNew:true}}
    $("#pTitle").textContent=draft.isNew?"북마크 추가":"북마크 편집";
    $("#fName").value=draft.name;$("#fUrl").value=draft.url;$("#fGlyph").value=draft.glyph;
    refreshEditor();
    $("#overlay").hidden=false;
    setTimeout(function(){$("#fName").focus()},30);
  }
  function closeEditor(){$("#overlay").hidden=true;draft=null}

  async function commitOrder(arr){
    for(var i=0;i<arr.length;i++){
      if(arr[i].order!==i+1){arr[i].order=i+1;try{await saveTileRemote(arr[i])}catch(e){}}
    }
  }
  async function onSave(){
    if(busy)return;
    draft.name=$("#fName").value.trim();draft.glyph=$("#fGlyph").value.trim();
    var raw=$("#fUrl").value.trim();draft.url=raw?safeUrl(raw):"";
    if(raw&&!draft.url){$("#err").textContent="주소는 https:// 로 시작하는 웹 주소여야 합니다.";return}
    if(!draft.name){$("#err").textContent="이름을 입력하세요.";return}
    busy=true;$("#saveBtn").disabled=true;
    try{
      var existing=st.tiles.find(function(x){return x.id===draft.id});
      if(draft.isNew){draft.order=st.tiles.reduce(function(m,x){return Math.max(m,x.order||0)},0)+1}
      var t={id:draft.id,name:draft.name,url:draft.url,glyph:draft.glyph,bg:draft.bg,img:draft.img,order:draft.order};
      if(existing)Object.assign(existing,t);else st.tiles.push(t);
      await saveTileRemote(existing||t);
      closeEditor();render();
    }catch(e){$("#err").textContent="저장하지 못했습니다. 잠시 후 다시 시도하세요."}
    busy=false;$("#saveBtn").disabled=false;
  }
  async function onDelete(){
    if(!delArmed){delArmed=true;refreshEditor();return}
    var id=draft.id;
    try{
      st.tiles=st.tiles.filter(function(x){return x.id!==id});
      lsSave();
      closeEditor();render();
    }catch(e){$("#err").textContent="삭제하지 못했습니다. 잠시 후 다시 시도하세요."}
  }
  async function onMove(dir){
    var arr=sorted(),i=arr.findIndex(function(x){return x.id===draft.id}),j=i+dir;
    if(i<0||j<0||j>=arr.length)return;
    var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
    render();refreshEditor();
    await commitOrder(arr);
  }

  /* 사진 → 정사각 256px JPEG */
  function onFile(f){
    if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2;
        var cv=document.createElement("canvas");cv.width=cv.height=256;
        cv.getContext("2d").drawImage(im,sx,sy,s,s,0,0,256,256);
        draft.img=cv.toDataURL("image/jpeg",0.85);refreshEditor();$("#err").textContent="";
      };
      im.onerror=function(){$("#err").textContent="이 사진을 열 수 없습니다. 다른 사진을 골라 보세요."};
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  }

  /* ---------- 이벤트 ---------- */
  $("#editBtn").addEventListener("click",function(){editMode=!editMode;render()});
  $("#title").addEventListener("change",saveTitle);
  $("#title").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();e.target.blur()}});
  $("#saveBtn").addEventListener("click",onSave);
  $("#cancelBtn").addEventListener("click",closeEditor);
  $("#delBtn").addEventListener("click",onDelete);
  $("#leftBtn").addEventListener("click",function(){onMove(-1)});
  $("#rightBtn").addEventListener("click",function(){onMove(1)});
  $("#pickImg").addEventListener("click",function(){$("#fileImg").click()});
  $("#clearImg").addEventListener("click",function(){draft.img="";refreshEditor()});
  $("#fileImg").addEventListener("change",function(e){onFile(e.target.files[0]);e.target.value=""});
  $("#fName").addEventListener("input",function(){draft.name=$("#fName").value;if(!$("#fGlyph").value.trim()){draft.glyph="";}refreshEditor()});
  $("#fGlyph").addEventListener("input",function(){draft.glyph=$("#fGlyph").value.trim();refreshEditor()});
  $("#overlay").addEventListener("click",function(e){if(e.target.id==="overlay")closeEditor()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&draft)closeEditor()});

  /* ---------- 백업 ---------- */
  function exportBackup(){
    var blob=new Blob([JSON.stringify({title:st.title,tiles:sorted().map(function(t){var o=fieldsOf(t);o.id=t.id;return o})},null,1)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="북마크-백업.json";
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
    setStatus("백업 파일을 저장했습니다.");
  }
  function importBackup(f){
    if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result);
        if(!j||!Array.isArray(j.tiles))throw new Error("bad");
        st={title:String(j.title||"").slice(0,40),tiles:j.tiles.slice(0,200).map(function(t,i){
          t=t||{};
          return {id:"t"+Date.now().toString(36)+i,name:String(t.name||"").slice(0,30),url:t.url?safeUrl(t.url):"",
            glyph:String(t.glyph||"").slice(0,2),bg:okColor(t.bg),img:okImg(t.img)?t.img:"",order:i+1};
        })};
        lsSave();render();setStatus("백업을 불러왔습니다.");
      }catch(e){setStatus("백업 파일을 읽을 수 없습니다.")}
    };
    rd.readAsText(f);
  }
  $("#expBtn").addEventListener("click",exportBackup);
  $("#impBtn").addEventListener("click",function(){$("#impFile").click()});
  $("#impFile").addEventListener("change",function(e){importBackup(e.target.files[0]);e.target.value=""});

  /* ---------- 시작 ---------- */
  function init(){
    buildSwatches();lsLoad();render();
    setStatus(saveFail?"이 브라우저는 저장을 막고 있어 변경 내용이 사라질 수 있어요.":"이 기기에 저장됩니다.");
  }
  init();
})();
</script>
</body>
</html>
